name: Fuzz

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libssl-dev zlib1g-dev libpsl-dev
      - name: Cache fuzz corpus
        uses: actions/cache@v4
        with:
          path: |
            fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Build fuzzers
        run: make fuzz-all
      - name: Fuzz URL parser (60s)
        run: |
          rc=0
          timeout 65 ./curldbg-fuzz-url fuzz/corpus/url -max_total_time=60 -entropic=0 || rc=$?
          if [ $rc -eq 124 ]; then echo "  (timeout safety cap reached)"; rc=0; fi
          exit $rc
      - name: Fuzz Huffman decode (60s)
        run: |
          rc=0
          timeout 65 ./curldbg-fuzz-huffman fuzz/corpus/huffman -max_total_time=60 -entropic=0 || rc=$?
          if [ $rc -eq 124 ]; then echo "  (timeout safety cap reached)"; rc=0; fi
          exit $rc
      - name: Fuzz HPACK primitives (60s)
        run: |
          rc=0
          timeout 65 ./curldbg-fuzz-hpack fuzz/corpus/hpack -max_total_time=60 -entropic=0 || rc=$?
          if [ $rc -eq 124 ]; then echo "  (timeout safety cap reached)"; rc=0; fi
          exit $rc
      - name: Fuzz HPACK header block (60s)
        run: |
          rc=0
          timeout 65 ./curldbg-fuzz-h2headers fuzz/corpus/h2headers -max_total_time=60 -entropic=0 || rc=$?
          if [ $rc -eq 124 ]; then echo "  (timeout safety cap reached)"; rc=0; fi
          exit $rc
      - name: Fuzz response headers (60s)
        run: |
          rc=0
          timeout 65 ./curldbg-fuzz fuzz/corpus/response -max_total_time=60 -entropic=0 || rc=$?
          if [ $rc -eq 124 ]; then echo "  (timeout safety cap reached)"; rc=0; fi
          exit $rc
